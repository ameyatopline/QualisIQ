name: QualisIQ quality workbench checks
on:
  push:
  pull_request:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Install and build web app
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run build
      - name: Static compilation and application tests
        run: |
          python -m compileall -q app ml scripts
          python -m pytest -q
      - name: Fresh demo fixture and model evaluation
        run: |
          python scripts/seed_enterprise.py --sites 24 --batches 5000 --results 50000
          python scripts/seed_workflows.py --cases 240
          python scripts/train_model.py
      - name: Configure isolated browser tests
        run: |
          python -m venv --system-site-packages .venv
          cd frontend
          npx playwright install --with-deps chromium
          CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())") npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-validation-evidence
          path: |
            frontend/test-results
            artifacts/qualisiq/report.json
